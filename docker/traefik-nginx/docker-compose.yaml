services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      # Lausche auf Docker-Events
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      
      # Entrypoints für HTTP (Port 80) und HTTPS (Port 443) definieren
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # Globale automatische Weiterleitung von HTTP (Port 80) zu HTTPS (Port 443)
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      
      # Lade die dynamische Konfiguration (für das Zertifikat)
      - "--providers.file.filename=/traefik-dynamic.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/traefik-dynamic.yml:ro
      - ./certs:/certs:ro

  web:
    image: nginx:latest
    container_name: nginx-web
    volumes:
      - ./html:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      # Nur noch Aufrufe über "test01.localhost" annehmen
      - "traefik.http.routers.myweb.rule=Host(`test01.localhost`)"
      - "traefik.http.routers.myweb.entrypoints=websecure"
      - "traefik.http.routers.myweb.tls=true"
