services:
  web:
    image: nginx:latest
    container_name: nginx-web
    volumes:
      - ../html:/usr/share/nginx/html:ro
    networks:
      - proxy-net      
    labels:
      - "traefik.enable=true"
      # Nur noch Aufrufe über "test01.localhost" annehmen
      - "traefik.http.routers.myweb.rule=Host(`test01.localhost`)"
      - "traefik.http.routers.myweb.entrypoints=websecure"
      - "traefik.http.routers.myweb.tls=true"
networks:
  proxy-net:
    external: true
