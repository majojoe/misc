version: '3'
services:
  webapp:
    image: devopslernen/webapp-swarm-demo
    ports:
      - "80:5000"
    deploy:
      replicas: 5
    depends_on:
      - database
  database:
    image: postgres
    environment:
      POSTGRES_DB: docker-compose-test
      POSTGRES_USER: docker-testuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

secrets:
  db_password:
    external: true